name: CI/CD & AppImage Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            alsa-utils \
            wl-clipboard \
            wtype \
            libgtk-4-dev \
            libadwaita-1-dev \
            libcairo2-dev \
            libgirepository1.0-dev \
            pkg-config

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Tests
        run: |
          pytest tests/ -v

  build-appimage:
    name: Compile & Package Linux AppImage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Build Tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfuse2 \
            desktop-file-utils \
            libgtk-4-dev \
            libadwaita-1-dev \
            libcairo2-dev \
            libgirepository1.0-dev \
            pkg-config
          python -m pip install --upgrade pip
          pip install pyinstaller pycairo PyGObject -e .

      - name: Compile Standalone Linux Binary
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onedir \
            --name "whistle" \
            --add-data "assets:assets" \
            --add-data "needle3.cact:." \
            --add-data "whistle.cact:." \
            --hidden-import "gi" \
            --hidden-import "gi.repository.Gtk" \
            --hidden-import "gi.repository.Adw" \
            --hidden-import "gi.repository.GLib" \
            --hidden-import "gi.repository.GObject" \
            jarvis/app.py

      - name: Fetch appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool

      - name: Build AppImage Directory Layout (AppDir)
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
          
          # Copy compiled distribution
          cp -r dist/whistle/* AppDir/usr/bin/
          
          # Desktop launcher & icons
          cp assets/whistle.svg AppDir/usr/share/icons/hicolor/scalable/apps/whistle.svg
          cp assets/whistle.svg AppDir/whistle.svg
          
          cat <<EOF > AppDir/whistle.desktop
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Whistle
          GenericName=Voice Dictation & Assistant
          Comment=Ultra-fast, privacy-first local voice dictation with technical WhisperFlow auto-correction
          Exec=whistle
          Icon=whistle
          Terminal=false
          Categories=AudioVideo;Audio;
          StartupWMClass=whistle
          EOF
          
          cat <<EOF > AppDir/AppRun
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\${0}")")"
          export PATH="\${HERE}/usr/bin:\${PATH}"
          export LD_LIBRARY_PATH="\${HERE}/usr/lib:\${LD_LIBRARY_PATH}"
          exec "\${HERE}/usr/bin/whistle" "\$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Package AppImage
        run: |
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir Whistle-x86_64.AppImage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Whistle-x86_64.AppImage
          path: Whistle-x86_64.AppImage
          retention-days: 14
