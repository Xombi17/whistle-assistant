<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2638" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Glass Rim Highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Wave / W Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.3" />
    </filter>
    
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base with Shadow -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="url(#rimGrad)" stroke-width="2.5" />

  <!-- Subtle Radial Ambient Glow in Center -->
  <circle cx="256" cy="256" r="140" fill="#2563eb" opacity="0.15" />

  <!-- Stylized Geometric "W" Soundwave -->
  <g filter="url(#iconShadow)">
    <!-- Central Soundwave Bars that form a dynamic "W" crest -->
    <!-- Bar 1 (Left Wing Outer) -->
    <rect x="116" y="210" width="22" height="92" rx="11" fill="url(#waveGrad)" opacity="0.75" />
    
    <!-- Bar 2 (Left Outer Mid) -->
    <rect x="152" y="160" width="22" height="192" rx="11" fill="url(#waveGrad)" opacity="0.9" />

    <!-- Bar 3 (Left Diag Down) -->
    <rect x="188" y="220" width="22" height="132" rx="11" fill="url(#glowGrad)" />

    <!-- Bar 4 (Left Bottom Valley) -->
    <rect x="224" y="270" width="22" height="82" rx="11" fill="url(#waveGrad)" />

    <!-- Bar 5 (Center Peak) -->
    <rect x="245" y="175" width="22" height="140" rx="11" fill="#ffffff" />

    <!-- Bar 6 (Right Bottom Valley) -->
    <rect x="266" y="270" width="22" height="82" rx="11" fill="url(#waveGrad)" />

    <!-- Bar 7 (Right Diag Up) -->
    <rect x="302" y="220" width="22" height="132" rx="11" fill="url(#glowGrad)" />

    <!-- Bar 8 (Right Outer Mid) -->
    <rect x="338" y="160" width="22" height="192" rx="11" fill="url(#waveGrad)" opacity="0.9" />

    <!-- Bar 9 (Right Wing Outer) -->
    <rect x="374" y="210" width="22" height="92" rx="11" fill="url(#waveGrad)" opacity="0.75" />
  </g>

  <!-- Concentric Sound Rings / Audio Pulse Accent -->
  <path d="M 120 150 A 180 180 0 0 1 392 150" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.25" />
  <path d="M 160 125 A 210 210 0 0 1 352 125" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" opacity="0.18" />
</svg>
