[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whistle-assistant"
version = "1.0.0"
description = "Fast, privacy-first voice dictation and intelligent WhisperFlow formatting for Linux (Wayland & X11) with technical auto-correction and native Hinglish support."
readme = "README.md"
authors = [
    { name = "Varad", email = "varad@example.com" }
]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "cactus-compute>=4,<5",
    "dateparser>=1.2,<2",
]
keywords = [
    "voice-dictation",
    "whisper",
    "speech-to-text",
    "wayland",
    "pipewire",
    "groq",
    "hinglish",
    "developer-tools",
    "linux",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Adaptive Technologies",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
whistle = "jarvis.server:main"
whistle-hud = "jarvis.hotkey:main"

[project.urls]
Homepage = "https://github.com/Xombi17/whistle-assistant"
Repository = "https://github.com/Xombi17/whistle-assistant"
Issues = "https://github.com/Xombi17/whistle-assistant/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
